name: Wanderlust CI Pipeline

on:
  push:
    branches:
      - main
permissions:
  contents: write    

jobs:
  build-and-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Backend Image
        run: |
          docker build -t xerox2/wanderlust-backend:${{ github.run_number }} ./backend
          docker tag xerox2/wanderlust-backend:${{ github.run_number }} xerox2/wanderlust-backend:latest

      - name: Build Frontend Image
        run: |
          docker build -t xerox2/wanderlust-frontend:${{ github.run_number }} ./frontend
          docker tag xerox2/wanderlust-frontend:${{ github.run_number }} xerox2/wanderlust-frontend:latest

      - name: Push Backend Image
        run: |
          docker push xerox2/wanderlust-backend:${{ github.run_number }}
          docker push xerox2/wanderlust-backend:latest

      - name: Push Frontend Image
        run: |
          docker push xerox2/wanderlust-frontend:${{ github.run_number }}
          docker push xerox2/wanderlust-frontend:latest
      - name: Clone Infrastructure Repository
        run: |
         git clone https://x-access-token:${{ secrets.GH_PAT }}@github.com/pushpendra-singh1176/wanderlust-infrastructure.git
      - name: Configure Git
        run: |
         git config --global user.name "github-actions"
         git config --global user.email "github-actions@github.com"
      - name: Update Backend Image Tag
        run: |
         sed -i '/backend:/,/frontend:/ s/tag: ".*"/tag: "${{ github.run_number }}"/' \
         wanderlust-infrastructure/helm/wanderlust/values.yaml
      - name: Verify Backend Tag
        run: |
         cat wanderlust-infrastructure/helm/wanderlust/values.yaml
      - name: Update Frontend Image Tag
        run: |
         sed -i '/frontend:/,/mongodb:/ s/tag: ".*"/tag: "${{ github.run_number }}"/' \
         wanderlust-infrastructure/helm/wanderlust/values.yaml
      - name: Verify Frontend Tag
        run: |
         cat wanderlust-infrastructure/helm/wanderlust/values.yaml
      - name: Update Chart Version
        run: |
         sed -i 's/^version:.*/version: 0.1.${{ github.run_number }}/' \
         wanderlust-infrastructure/helm/wanderlust/Chart.yaml

         sed -i 's/^appVersion:.*/appVersion: "${{ github.run_number }}"/' \
         wanderlust-infrastructure/helm/wanderlust/Chart.yaml
      - name: Verify Chart.yaml
        run: |
         cat wanderlust-infrastructure/helm/wanderlust/Chart.yaml
      - name: Helm lint
        run: |
         cd wanderlust-infrastructure/helm/wanderlust
         helm lint .
         
      - name: Helm Template
        run: |
         cd wanderlust-infrastructure/helm/wanderlust
         helm template wanderlust . -n wanderlust
      - name: Helm Package
        run: |
         cd wanderlust-infrastructure/helm
         helm package wanderlust
      - name: Verify Helm Package
        run: |
         ls -lh wanderlust-infrastructure/helm
      - name: Upload Helm Chart Artifact
        uses: actions/upload-artifact@v4
        with:
         name: helm-chart
         path: wanderlust-infrastructure/helm/*.tgz   

      - name: Login to OCI Registry
        run: |
         echo "${{ secrets.DOCKER_PASSWORD }}" | \
         helm registry login registry-1.docker.io \
         --username ${{ secrets.DOCKER_USERNAME }} \
         --password-stdin
         
      - name: Commit Changes
        run: |
         cd wanderlust-infrastructure
         git add .
         git commit -m "Update image tags to ${{ github.run_number }} [skip ci]" || echo "No changes to commit"
      - name: Git Diff
        run: |
         cd wanderlust-infrastructure
         git diff
         
      - name: Push Changes
        run: |
         cd wanderlust-infrastructure
         git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/pushpendra-singh1176/wanderlust-infrastructure.git
         git push origin main
